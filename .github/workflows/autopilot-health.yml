name: Autopilot Health

on:
  schedule:
    - cron: "14,29,44,59 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/autopilot_healthcheck.py"
      - "scripts/telegram_notify.py"
      - ".github/workflows/autopilot-health.yml"
      - "*_report.md"
      - "*_state.json"
      - "github_bounty_patches/**"
      - "taskbounty_patches/**"

concurrency:
  group: autopilot-health-main
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check autopilot health
        env:
          BOUNTY_GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN }}
          TASKBOUNTY_API_KEY: ${{ secrets.TASKBOUNTY_API_KEY }}
          TASKBOUNTY_AGENT_ID: ${{ secrets.TASKBOUNTY_AGENT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
          SOLVER_BASE_URL: ${{ secrets.SOLVER_BASE_URL }}
          AUTOPILOT_STALE_MINUTES: "45"
        run: python scripts/autopilot_healthcheck.py

      - name: Commit health report
        run: |
          git config user.name "autopilot-health-bot"
          git config user.email "autopilot-health-bot@users.noreply.github.com"
          git add AUTOPILOT_HEALTH.md autopilot_health.json
          if git diff --cached --quiet; then
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
            echo "No health report changes."
          else
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
            git commit -m "Update autopilot health"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi

      - name: Open/update health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Autopilot health status"
          body="$(cat AUTOPILOT_HEALTH.md)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Notify Telegram about health update
        if: env.REPORT_CHANGED == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "Autopilot Health: status changed"
          TELEGRAM_STATUS: "updated"
          TELEGRAM_REPORT_FILES: "AUTOPILOT_HEALTH.md"
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py

      - name: Notify Telegram about health failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "Autopilot Health: failed"
          TELEGRAM_STATUS: "failure"
          TELEGRAM_MESSAGE: "The autopilot health workflow failed and needs attention."
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py
