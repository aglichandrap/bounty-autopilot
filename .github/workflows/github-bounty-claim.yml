name: GitHub Bounty Claimer

on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/github_bounty_claimer.py"
      - "bounty_candidates.json"
      - ".github/workflows/github-bounty-claim.yml"

concurrency:
  group: github-bounty-claimer-main
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim one safe GitHub bounty candidate
        env:
          BOUNTY_GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN }}
          GITHUB_BOUNTY_MAX_CLAIMS: "1"
          GITHUB_BOUNTY_CLAIM_MAX_COMMENTS: "15"
        run: python scripts/github_bounty_claimer.py

      - name: Commit claim report
        run: |
          git config user.name "github-bounty-claimer-bot"
          git config user.email "github-bounty-claimer-bot@users.noreply.github.com"
          git add github_bounty_claim_report.md github_bounty_claim_state.json
          if git diff --cached --quiet; then
            echo "No claim report changes."
          else
            git commit -m "Update GitHub bounty claim report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi

      - name: Open/update claim issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s github_bounty_claim_report.md ]; then
            exit 0
          fi
          title="GitHub bounty claim status"
          body="$(cat github_bounty_claim_report.md)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
