name: GitHub Bounty Submitter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/github_bounty_submitter.py"
      - "scripts/telegram_notify.py"
      - "github_bounty_patches/**"
      - ".github/workflows/github-bounty-submitter.yml"

concurrency:
  group: github-bounty-submitter-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Submit ready GitHub bounty patches
        env:
          BOUNTY_GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN }}
        run: python scripts/github_bounty_submitter.py

      - name: Commit submission report
        run: |
          git config user.name "github-bounty-submitter-bot"
          git config user.email "github-bounty-submitter-bot@users.noreply.github.com"
          git add github_bounty_submission_report.md github_bounty_submission_state.json
          if git diff --cached --quiet; then
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
            echo "No submission report changes."
          else
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
            git commit -m "Update GitHub bounty submission report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi

      - name: Notify Telegram about GitHub submission update
        if: env.REPORT_CHANGED == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "GitHub Bounty Submitter: new submission/report"
          TELEGRAM_STATUS: "updated"
          TELEGRAM_REPORT_FILES: "github_bounty_submission_report.md"
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py

      - name: Notify Telegram about GitHub submission failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "GitHub Bounty Submitter: failed"
          TELEGRAM_STATUS: "failure"
          TELEGRAM_MESSAGE: "The GitHub bounty submitter workflow failed and needs attention."
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py
