name: TaskBounty Scout

on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/taskbounty_scout.py"
      - "scripts/claim_queue.py"
      - "scripts/telegram_notify.py"
      - ".github/workflows/taskbounty-scout.yml"

permissions:
  contents: write
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run TaskBounty scout
        env:
          TASKBOUNTY_API_KEY: ${{ secrets.TASKBOUNTY_API_KEY }}
          TASKBOUNTY_AGENT_ID: ${{ secrets.TASKBOUNTY_AGENT_ID }}
        run: |
          python scripts/taskbounty_scout.py
          python scripts/claim_queue.py

      - name: Commit report
        run: |
          git config user.name "taskbounty-scout-bot"
          git config user.email "taskbounty-scout-bot@users.noreply.github.com"
          git add taskbounty_report.md taskbounty_tasks.json claim_queue.md
          if git diff --cached --quiet; then
            echo "REPORT_CHANGED=0" >> "$GITHUB_ENV"
            echo "No TaskBounty report changes."
          else
            echo "REPORT_CHANGED=1" >> "$GITHUB_ENV"
            git commit -m "Update TaskBounty scout report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase origin main
              sleep 5
            done
          fi

      - name: Open/update TaskBounty candidate issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s taskbounty_report.md ]; then
            exit 0
          fi
          title="TaskBounty candidates"
          body="$(cat taskbounty_report.md; printf '\n\n---\n\n'; cat claim_queue.md)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Notify Telegram about TaskBounty scout update
        if: env.REPORT_CHANGED == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "TaskBounty Scout: new report/change"
          TELEGRAM_STATUS: "updated"
          TELEGRAM_REPORT_FILES: "taskbounty_report.md,claim_queue.md"
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py

      - name: Notify Telegram about TaskBounty scout failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TITLE: "TaskBounty Scout: failed"
          TELEGRAM_STATUS: "failure"
          TELEGRAM_MESSAGE: "The TaskBounty scout workflow failed and needs attention."
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/telegram_notify.py
