name: Bounty Scout

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/bounty_scout.py"
      - "scripts/bounty_volume_expander.py"
      - "scripts/algora_bounty_scout.py"
      - "scripts/bounty_candidate_triage.py"
      - "scripts/bounty_worker_queue.py"
      - "scripts/claim_queue.py"
      - "scripts/github_openai_patch_solver.py"
      - "scripts/github_patch_solver_router.py"
      - "bounty_extra_queries.txt"
      - ".github/workflows/bounty-scout.yml"

concurrency:
  group: bounty-scout-main
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      SCOUT_GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounty scout
        env:
          GITHUB_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
        run: python scripts/bounty_scout.py

      - name: Expand bounty candidate volume
        env:
          GITHUB_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
          GITHUB_SEARCH_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
          BOUNTY_VOLUME_MAX_CANDIDATES: "100"
          BOUNTY_VOLUME_MIN_SCORE: "20"
        run: python scripts/bounty_volume_expander.py

      - name: Add Algora bounty candidates
        env:
          GITHUB_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
        run: python scripts/algora_bounty_scout.py

      - name: Triage GitHub bounty candidates
        env:
          GITHUB_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
          BOUNTY_MAX_COMMENTS: "25"
          BOUNTY_MIN_PAID_AMOUNT: "10"
        run: python scripts/bounty_candidate_triage.py

      - name: Generate GitHub bounty patch
        env:
          GITHUB_TOKEN: ${{ env.SCOUT_GITHUB_TOKEN }}
          GITHUB_SOLVER_MAX_TASKS: "5"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SOLVER_MODEL: ${{ secrets.OPENAI_SOLVER_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOLVER_API_KEY: ${{ secrets.SOLVER_API_KEY }}
          SOLVER_BASE_URL: ${{ secrets.SOLVER_BASE_URL }}
          SOLVER_MODEL: ${{ secrets.SOLVER_MODEL }}
        run: python scripts/github_patch_solver_router.py

      - name: Build worker and claim queues
        run: |
          python scripts/bounty_worker_queue.py
          python scripts/claim_queue.py

      - name: Commit report
        run: |
          mkdir -p github_bounty_patches
          git config user.name "bounty-scout-bot"
          git config user.email "bounty-scout-bot@users.noreply.github.com"
          git add bounty_report.md bounty_candidates.json bounty_candidate_triage_report.md bounty_worker_queue.md claim_queue.md algora_bounty_report.md bounty_volume_report.md github_openai_patch_solver_report.md github_bounty_patches
          if git diff --cached --quiet; then
            echo "No bounty report changes."
          else
            git commit -m "Update bounty scout report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi

      - name: Open/update candidate issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s bounty_report.md ]; then
            exit 0
          fi
          title="Bounty scout candidates"
          body="$(cat bounty_worker_queue.md; printf '\n\n---\n\n'; cat claim_queue.md; printf '\n\n---\n\n'; cat algora_bounty_report.md; printf '\n\n---\n\n'; cat bounty_volume_report.md; printf '\n\n---\n\n'; cat github_openai_patch_solver_report.md; printf '\n\n---\n\n'; cat bounty_candidate_triage_report.md; printf '\n\n---\n\n'; cat bounty_report.md)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi