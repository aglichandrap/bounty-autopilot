name: Bounty Scout

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/bounty_scout.py"
      - "scripts/bounty_candidate_triage.py"
      - "scripts/bounty_worker_queue.py"
      - "scripts/claim_queue.py"
      - "bounty_extra_queries.txt"
      - ".github/workflows/bounty-scout.yml"

concurrency:
  group: bounty-scout-main
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounty scout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/bounty_scout.py

      - name: Triage GitHub bounty candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/bounty_candidate_triage.py

      - name: Build worker and claim queues
        run: |
          python scripts/bounty_worker_queue.py
          python scripts/claim_queue.py

      - name: Commit report
        run: |
          git config user.name "bounty-scout-bot"
          git config user.email "bounty-scout-bot@users.noreply.github.com"
          git add bounty_report.md bounty_candidates.json bounty_candidate_triage_report.md bounty_worker_queue.md claim_queue.md
          if git diff --cached --quiet; then
            echo "No bounty report changes."
          else
            git commit -m "Update bounty scout report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi

      - name: Open/update candidate issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s bounty_report.md ]; then
            exit 0
          fi
          title="Bounty scout candidates"
          body="$(cat bounty_worker_queue.md; printf '\n\n---\n\n'; cat claim_queue.md; printf '\n\n---\n\n'; cat bounty_candidate_triage_report.md; printf '\n\n---\n\n'; cat bounty_report.md)"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
