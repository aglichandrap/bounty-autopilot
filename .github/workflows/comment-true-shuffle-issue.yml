name: Comment True Shuffle Issue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/comment_true_shuffle_issue.py"
      - ".github/workflows/comment-true-shuffle-issue.yml"

concurrency:
  group: comment-true-shuffle-issue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comment on issue
        env:
          BOUNTY_GITHUB_TOKEN: ${{ secrets.BOUNTY_GITHUB_TOKEN }}
        run: python scripts/comment_true_shuffle_issue.py

      - name: Commit comment report
        if: always()
        run: |
          git config user.name "true-shuffle-commenter-bot"
          git config user.email "true-shuffle-commenter-bot@users.noreply.github.com"
          git add true_shuffle_issue_comment_report.md || true
          if git diff --cached --quiet; then
            echo "No comment report changes."
          else
            git commit -m "Update true shuffle issue comment report"
            for attempt in 1 2 3; do
              git push && break
              git pull --rebase -X ours origin main
              sleep 5
            done
          fi
